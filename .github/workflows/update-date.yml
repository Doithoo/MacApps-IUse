name: Update Last Modified Date

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
  schedule:
    - cron: '0 16 * * *'  # 每天 UTC 16:00 = 北京时间次日 00:00
  workflow_dispatch:

jobs:
  update-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: 'Asia/Shanghai'  # 使用本地日历日，避免 UTC 时区导致日期差一天

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update last modified date in README
        shell: bash
        run: |
          CURRENT_DATE=$(date +'%Y-%m-%d')
          ./script/update-readme-date.sh "$CURRENT_DATE"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Update last modified date to $CURRENT_DATE [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
